  <button data-view="exterior">Storefront at night</button>
  <button data-view="moongate">Through the moon gate</button>
  <button data-view="kneewall">Facing the door (arch)</button>
  <button data-view="hibachiRow">Facing left from the door</button>
  <button data-view="across">Across the dining room</button>
  <button data-view="pods">North hibachi pods</button>
  <button data-view="sushi">Sushi bar</button>
  <button data-view="bar">Cocktail bar</button>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// Layout reconstructed from photos. Front of the building faces +z (parking lot).

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.495;

// ---------- helpers ----------
const geoCache = {}, matCache = {};
function mat(color, opts = {}) {
  const key = color + JSON.stringify(opts);
  return matCache[key] ??= new THREE.MeshStandardMaterial({ color, roughness: 0.75, ...opts });
}
function boxGeo(w, h, d) { const k = `${w}|${h}|${d}`; return geoCache[k] ??= new THREE.BoxGeometry(w, h, d); }
// box with its *bottom* at y
function box(w, h, d, m, x, y, z, parent = scene, shadow = true) {
  const mesh = new THREE.Mesh(boxGeo(w, h, d), typeof m === 'string' ? mat(m) : m);
  mesh.position.set(x, y + h / 2, z);
  if (shadow) mesh.castShadow = mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function cyl(rt, rb, h, m, x, y, z, seg = 16, parent = scene) {
  const k = `c${rt}|${rb}|${h}|${seg}`;
  const mesh = new THREE.Mesh(geoCache[k] ??= new THREE.CylinderGeometry(rt, rb, h, seg), typeof m === 'string' ? mat(m) : m);
  mesh.position.set(x, y + h / 2, z);
  mesh.castShadow = mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function plane(w, h, m, x, y, z, ry = 0, parent = scene) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
  p.position.set(x, y, z); p.rotation.y = ry; parent.add(p); return p;
}
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
const texCache = {};
function repTex(name, maker, rx, ry) {   // clone a base texture with a given repeat
  const base = texCache[name] ??= maker();
  const t = base.clone(); t.needsUpdate = true; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return t;
}

// ---------- palette (sampled from photos) ----------
const C = {
  terracotta: '#c47657', facade: '#cbbd9f', facadeDark: '#a99a7e', red: '#c8262b', awning: '#d42a35',
  hibachiRed: '#8a1d1d', tableTop: '#2a2421', black: '#151515', pine: '#c58d4c', lightWood: '#d9b47a',
  cherry: '#6e2018', steel: '#b9bdc2', carpetAisle: '#4a4240', carpetTeal: '#3f5c66', ceiling: '#ddd7ca',
};

// ---------- textures ----------
const ribTex = () => canvasTex(256, 256, (g, w, h) => {      // vertical split-rib masonry
  g.fillStyle = C.facade; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 8; i++) {
    const x = i * 32;
    const grd = g.createLinearGradient(x, 0, x + 32, 0);
    grd.addColorStop(0, '#b8aa8c'); grd.addColorStop(0.35, '#d8cbb0'); grd.addColorStop(0.7, '#cdbfa3'); grd.addColorStop(1, '#a5977b');
    g.fillStyle = grd; g.fillRect(x, 0, 32, h);
  }
  g.fillStyle = 'rgba(80,70,55,.35)'; for (let y = 0; y < h; y += 64) g.fillRect(0, y, w, 2);
  for (let i = 0; i < 1500; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '60,50,40'},.07)`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
});
const brickTex = () => canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#5e4a40'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 16; r++) for (let c = -1; c < 5; c++) {
    g.fillStyle = `hsl(${12 + Math.random() * 10},${30 + Math.random() * 15}%,${30 + Math.random() * 10}%)`;
    g.fillRect(c * 64 + (r % 2) * 32 + 2, r * 16 + 2, 60, 12);
  }
});
const glassBlockTex = () => canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#8f8f86'; g.fillRect(0, 0, w, h);
  for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
    const x = c * 64 + 3, y = r * 64 + 3;
    const grd = g.createRadialGradient(x + 29, y + 29, 4, x + 29, y + 29, 44);
    grd.addColorStop(0, '#fffbe0'); grd.addColorStop(0.6, '#f0f2c8'); grd.addColorStop(1, '#bfc79a');
    g.fillStyle = grd; g.fillRect(x, y, 58, 58);
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 2;
    for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(x + 6, y + 10 + k * 13); g.bezierCurveTo(x + 20, y + 4 + k * 13, x + 38, y + 18 + k * 13, x + 52, y + 10 + k * 13); g.stroke(); }
  }
});
const shojiTex = () => canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#f6f1e2'; g.fillRect(0, 0, w, h); g.strokeStyle = '#3b2716'; g.lineWidth = 9;
  for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.stroke(); }
  for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke(); }
});
const ceilingTex = () => canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = C.ceiling; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2500; i++) { g.fillStyle = 'rgba(120,110,95,.12)'; g.fillRect(Math.random() * w, Math.random() * h, 1.5, 1.5); }
  g.fillStyle = '#f2efe8'; g.fillRect(0, 0, w, 5); g.fillRect(0, 0, 5, h); g.fillRect(0, 128, w, 5); g.fillRect(128, 0, 5, h);
});
const blindsTex = () => canvasTex(128, 256, (g, w, h) => {
  for (let y = 0; y < h; y += 8) { g.fillStyle = '#e8dcc4'; g.fillRect(0, y, w, 6); g.fillStyle = '#6d5a43'; g.fillRect(0, y + 6, w, 2); }
});
const carpetTex = (base) => () => canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '0,0,0'},.06)`; g.fillRect(Math.random() * w, Math.random() * h, 1, 1); }
});
function kyotoLogo(g, cx, cy, r, color = '#111') {           // the circled K with chopsticks
  g.save(); g.strokeStyle = color; g.lineWidth = r * 0.12;
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
  g.fillStyle = color; g.font = `bold ${r * 1.25}px Georgia`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('K', cx, cy + r * 0.05);
  g.lineWidth = r * 0.07; g.beginPath(); g.moveTo(cx - r * 2.0, cy - r * 1.5); g.lineTo(cx + r * 1.6, cy + r * 0.3); g.stroke();
  g.beginPath(); g.moveTo(cx - r * 1.9, cy - r * 1.75); g.lineTo(cx + r * 1.7, cy + r * 0.0); g.stroke();
  g.restore();
}

// =====================================================================
//  SITE  (end unit of a strip plaza; lot to the east)
//  Kyoto's unit is ~22 m of frontage at the corner; a gym is the next unit south.
//  Axes: +z = front (east, parking lot), +x = north, -x = south (gym side).
// =====================================================================
const W = 22;                     // frontage (m)
const FX = W / 2, FZ = 10, BZ = -12;   // x: -11..11, z: -12 (back of kitchen)..10 (storefront)
const D = FZ - BZ;
const CEIL = 3.0, PARAPET = 4.8, PLAT = 0.3;
const VX0 = -3.5, VX1 = 2.5, VDEP = 3.4;          // vestibule bump-out
const GX = (VX0 + VX1) / 2;                        // moon gate centre line
const DINE_BACK = -8.8;                            // kitchen wall

const asphalt = new THREE.Mesh(new THREE.PlaneGeometry(260, 260),
  new THREE.MeshStandardMaterial({ color: '#2a2b2d', roughness: 0.95 }));
asphalt.rotation.x = -Math.PI / 2; asphalt.receiveShadow = true; scene.add(asphalt);
for (let i = -12; i <= 6; i++) box(0.12, 0.01, 5.2, '#d9d7cc', i * 2.75, 0.005, FZ + 13, scene, false);
for (let i = -12; i <= 6; i++) box(0.12, 0.01, 5.2, '#d9d7cc', i * 2.75, 0.005, FZ + 23, scene, false);
box(70, 0.14, 2.4, '#8d8b85', -24, 0, FZ + 1.2);                   // walkway along the storefronts
box(3, 0.14, D + 6, '#8d8b85', FX + 1.5, 0, (FZ + BZ) / 2);         // walk round the north end

function car(x, z, color, ry = 0) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; scene.add(g);
  box(1.85, 0.75, 4.5, color, 0, 0.28, 0, g);
  box(1.65, 0.6, 2.3, '#1f2a33', 0, 1.03, -0.2, g);
  [[-0.88, 1.45], [0.88, 1.45], [-0.88, -1.45], [0.88, -1.45]].forEach(([wx, wz]) => {
    const w = cyl(0.34, 0.34, 0.24, '#0e0e0e', wx, 0, wz, 16, g); w.rotation.z = Math.PI / 2; w.position.y = 0.34;
  });
  const hl = new THREE.MeshStandardMaterial({ color: '#fff', emissive: '#fff8e0', emissiveIntensity: 0.4 });
  box(0.3, 0.12, 0.05, hl, -0.6, 0.75, 2.26, g); box(0.3, 0.12, 0.05, hl, 0.6, 0.75, 2.26, g);
}
car(9.5, FZ + 5.2, '#e6e6e3', Math.PI / 2 + 0.08); car(-13.7, FZ + 13, '#6f747a'); car(-8.2, FZ + 13, '#20385f');
car(2.8, FZ + 13, '#7a1d1d'); car(-19.2, FZ + 23, '#c9c9c9'); car(5.5, FZ + 23, '#2f3a2a');
cyl(0.1, 0.14, 9, '#555', -16, 0, FZ + 18); box(1.2, 0.25, 0.5, '#444', -16, 9, FZ + 18);

// ---------- neighbouring gym: next unit south, storefront recessed under a deep brick canopy ----------
const brickM = (w, h) => new THREE.MeshStandardMaterial({ map: repTex('brick', brickTex, w / 2.5, h / 2.5), roughness: 0.9 });
box(14, 5.4, D - 3, brickM(14, 5.4), -FX - 7, 0, (BZ + FZ - 3) / 2);
box(14, 2.3, 0.3, brickM(14, 2.3), -FX - 7, 3.1, FZ - 0.15);
box(10.5, 2.75, 0.06, new THREE.MeshPhysicalMaterial({ color: '#a8c8d8', roughness: 0.05, transparent: true, opacity: 0.55, emissive: '#cfe6f2', emissiveIntensity: 0.35 }), -FX - 7.6, 0.15, FZ - 3.1);
box(10.5, 2.6, 0.2, mat('#3a3a3a'), -FX - 7.6, 0.15, FZ - 3.3);
box(0.8, 3.1, 0.8, brickM(0.8, 3.1), -FX - 0.55, 0, FZ - 0.3); box(0.8, 3.1, 0.8, brickM(0.8, 3.1), -FX - 13.4, 0, FZ - 0.3);
box(1.6, 5.9, 2.2, brickM(1.6, 5.9), -FX - 0.9, 0, FZ - 1.4);              // the taller brick pier at the unit line
// rest of the strip running south (simple massing)
box(40, 5.0, 30, mat('#9d9483', { roughness: 0.95 }), -FX - 34, 0, FZ - 16);

// =====================================================================
//  KYOTO BUILDING SHELL — tan split-rib block, pink LED cove on the parapet
// =====================================================================
const facadeMats = [];
const ribM = (w, h) => { const t = repTex('rib', ribTex, w, h / 2);
  const m = new THREE.MeshStandardMaterial({ map: t, emissiveMap: t, emissive: '#ffe2bd', emissiveIntensity: 0, roughness: 0.92 });
  facadeMats.push(m); return m; };
const paint = mat(C.terracotta, { roughness: 0.9 });
const roofGroup = new THREE.Group(); scene.add(roofGroup);

function frontSeg(x0, x1, y0, y1) { const w = x1 - x0, h = y1 - y0; box(w, h, 0.3, ribM(w, h), (x0 + x1) / 2, y0, FZ); }
// south bay (long awning + wide window), bump-out opening, long blank north bay with one window at the far end
frontSeg(-FX, -9.5, 0, PARAPET);
frontSeg(-9.5, -5.5, 0, 0.9); frontSeg(-9.5, -5.5, 2.45, PARAPET);
frontSeg(-5.5, VX0, 0, PARAPET);
frontSeg(VX0, VX1, CEIL, PARAPET);
frontSeg(VX1, 5.0, 0, PARAPET);
frontSeg(5.0, 8.0, 0, 0.9); frontSeg(5.0, 8.0, 2.45, PARAPET);
frontSeg(8.0, FX, 0, PARAPET);
box(0.3, PARAPET, D, ribM(D, PARAPET), FX, 0, (FZ + BZ) / 2);           // north end wall (end of the strip)
box(0.3, PARAPET, D, ribM(D, PARAPET), -FX, 0, (FZ + BZ) / 2);
box(W, PARAPET, 0.3, ribM(W, PARAPET), 0, 0, BZ);
// back half of the strip building behind Kyoto (the strip is ~36 m deep)
box(W, PARAPET - 0.2, 14, mat('#a89c86', { roughness: 0.95 }), 0, 0, BZ - 7);

const blindsMat = new THREE.MeshStandardMaterial({ map: repTex('blinds', blindsTex, 1, 1), emissive: '#ffd9a8', emissiveIntensity: 0.25 });
[[-7.5, 4.0], [6.5, 3.0]].forEach(([cx, w]) => {
  plane(w, 1.55, blindsMat, cx, 1.675, FZ + 0.16); plane(w, 1.55, blindsMat, cx, 1.675, FZ - 0.16, Math.PI);
  box(w + 0.2, 0.08, 0.36, '#e9e4d6', cx, 0.86, FZ);
});

const ledMat = new THREE.MeshStandardMaterial({ color: '#ff5b8a', emissive: '#ff2f6b', emissiveIntensity: 2.2 });
const ledGlow = new THREE.MeshBasicMaterial({ color: '#ff3d7a', transparent: true, opacity: 0.35, depthWrite: false });
box(W + 0.4, 0.12, 0.4, '#8f8572', 0, PARAPET, FZ);
box(0.4, 0.12, D, '#8f8572', FX, PARAPET, (FZ + BZ) / 2);
box(W + 0.4, 0.08, 0.08, ledMat, 0, PARAPET - 0.25, FZ + 0.2, scene, false);
box(W + 0.4, 0.3, 0.02, ledGlow, 0, PARAPET - 0.36, FZ + 0.24, scene, false);
box(0.08, 0.08, D, ledMat, FX + 0.2, PARAPET - 0.25, (FZ + BZ) / 2, scene, false);
box(0.02, 0.3, D, ledGlow, FX + 0.24, PARAPET - 0.36, (FZ + BZ) / 2, scene, false);

// ---------- vestibule bump-out with the red "K" awning ----------
const VZ1 = FZ + VDEP, VH = 4.1;
box(VX1 - VX0, VH, 0.3, ribM(6, VH), GX, 0, VZ1);
box(0.3, VH, VDEP, ribM(VDEP, VH), VX1, 0, FZ + VDEP / 2);
box(0.3, VH, VDEP - 1.3, ribM(VDEP - 1.3, VH), VX0, 0, FZ + 1.3 + (VDEP - 1.3) / 2);   // south face: glass door at z 10..11.3
box(0.3, VH - 2.4, 1.3, ribM(1.3, 1.7), VX0, 2.4, FZ + 0.65);
roofGroup.add(box(VX1 - VX0 + 0.3, 0.25, VDEP + 0.3, '#5d554a', GX, VH, FZ + VDEP / 2));
roofGroup.add(box(VX1 - VX0, 0.1, VDEP, '#3d3d3d', GX, VH - 0.1, FZ + VDEP / 2));
const doorGlass = new THREE.MeshPhysicalMaterial({ color: '#2a3a44', roughness: 0.05, transparent: true, opacity: 0.45, emissive: '#ffcf96', emissiveIntensity: 0.2 });
box(0.06, 2.3, 1.2, doorGlass, VX0, 0.05, FZ + 0.65);
box(0.1, 2.4, 0.06, '#222', VX0, 0, FZ + 0.65);
box(0.12, 0.5, 0.04, C.steel, VX0 - 0.1, 0.95, FZ + 0.85);
plane(1.8, 1.25, blindsMat, GX, 1.6, VZ1 + 0.16);                // window with blinds + NOW HIRING
box(2.0, 0.08, 0.3, '#e9e4d6', GX, 0.95, VZ1 + 0.05);
plane(0.6, 0.35, new THREE.MeshStandardMaterial({ map: canvasTex(200, 120, (g, w, h) => { g.fillStyle = '#111'; g.fillRect(0, 0, w, h); g.fillStyle = '#eee'; g.font = 'bold 34px Arial'; g.textAlign = 'center'; g.fillText('NOW', w / 2, 50); g.fillText('HIRING', w / 2, 95); }) }), GX + 0.2, 1.25, VZ1 + 0.17);

function awning(x0, x1, yTop, zWall, depth, drop, logo) {
  const w = x1 - x0;
  const t = logo ? canvasTex(512, 256, (g, cw, ch) => {
    g.fillStyle = C.awning; g.fillRect(0, 0, cw, ch);
    g.fillStyle = '#fff'; g.beginPath(); g.arc(cw / 2, ch * 0.55, 62, 0, Math.PI * 2); g.fill();
    g.strokeStyle = C.awning; g.lineWidth = 6; g.beginPath(); g.arc(cw / 2, ch * 0.55, 52, 0, Math.PI * 2); g.stroke();
    g.fillStyle = C.awning; g.font = 'bold 76px Georgia'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('K', cw / 2, ch * 0.57);
  }) : null;
  const m = new THREE.MeshStandardMaterial({ color: logo ? '#fff' : C.awning, map: t, emissive: '#ff2a2a', emissiveIntensity: 0.18, side: THREE.DoubleSide, roughness: 0.6 });
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, Math.hypot(depth, drop)), m);
  p.position.set((x0 + x1) / 2, yTop - drop / 2, zWall + depth / 2);
  p.rotation.x = -Math.PI / 2 + Math.atan2(drop, depth); scene.add(p);
  box(w, 0.3, 0.04, mat(C.awning, { emissive: '#ff2a2a', emissiveIntensity: 0.18 }), (x0 + x1) / 2, yTop - drop - 0.3, zWall + depth);
  box(0.04, 0.3 + drop, depth, mat(C.awning), x0, yTop - drop - 0.3, zWall + depth / 2);
  box(0.04, 0.3 + drop, depth, mat(C.awning), x1, yTop - drop - 0.3, zWall + depth / 2);
}
awning(GX - 1.3, GX + 1.3, 3.4, VZ1 + 0.15, 0.95, 0.7, true);
// long awning in three bays on red pipe posts over the walk to the door
[[-10.6, -8.3], [-8.3, -6.0], [-6.0, -3.6]].forEach(([a, b]) => awning(a, b, 3.1, FZ + 0.15, 1.9, 0.75, false));
[-10.6, -3.6].forEach(x => cyl(0.04, 0.04, 2.05, mat(C.red, { metalness: 0.4 }), x, 0, FZ + 2.05, 8));
awning(5.15, 7.85, 3.0, FZ + 0.15, 0.9, 0.65, true);              // north bay window with its own K awning (dusk photo)
const underLight = new THREE.PointLight('#ff6a5a', 0, 6, 2); underLight.position.set(-7.0, 2.1, FZ + 1.2); scene.add(underLight);

// planter curb in front of the bump-out with shrubs + string lights; low stone wall under the long awning
box(6.8, 0.45, 1.7, '#a9a597', GX, 0, VZ1 + 1.1);
box(6.5, 0.05, 1.4, '#2b2218', GX, 0.45, VZ1 + 1.1);

  face.rotation.x = -slopeA;
  for (let x = -hw / 2 + 0.7; x <= hw / 2 - 0.6; x += 1.15) { const c = new THREE.Mesh(canGeo, canMat); c.rotation.x = Math.PI / 2; c.position.set(x, -0.57, 0.6); hoodG.add(c); }

// ---------- day / night ----------
let night = true;
function applyTime() {
  scene.background = new THREE.Color(night ? '#05070e' : '#a9c7e3');
  scene.fog = new THREE.Fog(scene.background, 70, 200);
  sun.intensity = night ? 0.05 : 2.4;
  hemi.intensity = night ? 0.08 : 0.6;
  signMat.emissiveIntensity = night ? 1.0 : 0.15;
  signLight.intensity = night ? 60 : 0;
  ledMat.emissiveIntensity = night ? 2.4 : 0.6;
  underLight.intensity = night ? 3 : 0;
  fairy.visible = night;
  blindsMat.emissiveIntensity = night ? 0.5 : 0.05;
  facadeMats.forEach(m => m.emissiveIntensity = night ? 0.32 : 0);
  scene.environmentIntensity = night ? 0.35 : 0.8;
  renderer.toneMappingExposure = night ? 1.25 : 1.0;
  document.getElementById('nightBtn').classList.toggle('on', !night);
}
applyTime();

// ---------- views (camera spots match the reference photos) ----------
const views = {
  exterior:   { pos: [6.5, 1.7, FZ + 19], target: [GX, 3.5, FZ + 1], roof: true },
  moongate:   { pos: [GX, 1.55, FZ + 2.9], target: [-1.15, 1.3, -8], roof: true },
  kneewall:   { pos: [-3.75, 1.6, -3.6], target: [-0.2, 1.3, FZ], roof: true },
  hibachiRow: { pos: [-2.35, PLAT + 1.45, 5.5], target: [-10.85, PLAT + 1.0, 7.3], roof: true },
  across:     { pos: [-4.75, PLAT + 1.35, -0.6], target: [-3.2, 1.4, -8.8], roof: true },
  pods:       { pos: [2.3, PLAT + 1.25, 5.3], target: [11, PLAT + 1.0, 5.6], roof: true },
  sushi:      { pos: [-4.9, 1.75, -4.6], target: [-10.8, 1.2, -7.3], roof: true },
  bar:        { pos: [-1.15, 1.7, 0.8], target: [-1.15, 1.5, -8.8], roof: true },
  cutaway:    { pos: [17, 30, 25], target: [0, 0, -1], roof: false },
};
let tween = null;
function setRoof(v) { roofGroup.visible = v; document.getElementById('roofBtn').classList.toggle('on', !v); }
function goTo(name) {
  const v = views[name]; setRoof(v.roof);
  tween = { t: 0, fromP: camera.position.clone(), toP: new THREE.Vector3(...v.pos), fromT: controls.target.clone(), toT: new THREE.Vector3(...v.target) };
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === name));
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => goTo(b.dataset.view));
document.getElementById('roofBtn').onclick = () => setRoof(!roofGroup.visible);
document.getElementById('nightBtn').onclick = () => { night = !night; applyTime(); };
camera.position.set(...views.exterior.pos); controls.target.set(...views.exterior.target);
const hashView = new URLSearchParams(location.hash.slice(1)).get('view');
goTo(views[hashView] ? hashView : 'exterior'); tween.t = 1;
camera.position.copy(tween.toP); controls.target.copy(tween.toT);
if (new URLSearchParams(location.hash.slice(1)).get('day')) { night = false; applyTime(); }

// ---------- loop ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime;
  if (tween && tween.t < 1) {
    tween.t = Math.min(1, tween.t + dt / 1.4);
    const k = tween.t < 0.5 ? 2 * tween.t * tween.t : 1 - Math.pow(-2 * tween.t + 2, 2) / 2;
    camera.position.lerpVectors(tween.fromP, tween.toP, k);
    controls.target.lerpVectors(tween.fromT, tween.toT, k);
  }
  flames.forEach((f, i) => {           // onion-volcano flare-ups, staggered per table
    const burst = Math.max(0, Math.sin(t * 1.1 + i * 1.9)) ** 10;
    const s = 0.25 + Math.sin(t * 22 + i) * 0.05 + burst * 2.6;
    f.scale.set(1, s, 1); f.position.y = 0.92 + 0.25 * s; f.visible = burst > 0.05;
    f.userData.light.intensity = 0.3 + burst * 6;
  });
  controls.update();
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
